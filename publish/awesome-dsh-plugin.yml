# Mnemosyne — DSH 官方插件库投稿条目
#
# 提交方式：给 awesome-dsh-plugin/awesome-dsh-plugin 提 PR，
# 新增文件 data/plugins/i11ustriouS__dsh-mnemosyne.yml
#
# ⚠️ 提交前必须替换 i11ustriouS 为你的 GitHub 用户名（共 2 处），
#    且 url / name 必须与实际仓库完全一致。
#
# 注意：description 含 ": "（冒号+空格）时必须加引号，否则 YAML 解析失败。

url: https://github.com/i11ustriouS/dsh-mnemosyne
name: i11ustriouS/dsh-mnemosyne
category: memory
description:
  en: 'Layered long-term memory: a persona frame and a relevance-ranked memory index are injected each turn while full transcripts stay on disk, with autonomous persona derivation, reversible consolidation, and log compaction.'
  zh: '分层长期记忆：每轮只注入「人设框架 + 相关记忆索引」，原文留磁盘按需展开；人设由模型从记忆里自行归纳，记忆会自动合并与固化，存储也会压缩。'

